<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Still There - Live City Webcams</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Landing Page */
        .landing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .landing.hidden {
            display: none;
        }

        .prompt {
            font-size: 1.5rem;
            line-height: 1.8;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        .autocomplete-container {
            position: relative;
            display: inline-block;
            min-width: 250px;
        }

        #cityInput {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 1.5rem;
            padding: 12px 16px;
            width: 100%;
            font-weight: 300;
            transition: all 0.3s ease;
        }

        #cityInput:focus {
            outline: none;
            border-color: #555;
            background: #222;
        }

        #cityInput::placeholder {
            color: #666;
        }

        .autocomplete-items {
            position: absolute;
            border: 1px solid #333;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            background: #1a1a1a;
            border-radius: 0 0 4px 4px;
        }

        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            background-color: #1a1a1a;
            border-bottom: 1px solid #2a2a2a;
            font-size: 1.1rem;
            color: #e0e0e0;
        }

        .autocomplete-item:hover {
            background-color: #2a2a2a;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        /* Quiet text actions (surprise me, home shortcut, set-as-home) */
        .landing-actions {
            margin-top: 1.75rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            min-height: 1.2rem;
        }

        .link-button {
            background: none;
            border: none;
            color: #666;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 300;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.3s ease;
        }

        .link-button:hover {
            color: #aaa;
        }

        /* Webcam View */
        .webcam-view {
            display: none;
            width: 100%;
            max-width: 1400px;
            padding: 20px 0;
        }

        .webcam-view.active {
            display: block;
        }

        .back-button {
            background: transparent;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        .back-button:hover {
            background: #1a1a1a;
            border-color: #555;
        }

        .city-title {
            font-size: 2rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .view-actions {
            text-align: center;
            margin-bottom: 2rem;
        }

        .webcam-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-top: 20px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .webcam-container {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .webcam-container:hover {
            transform: translateY(-4px);
        }

        .webcam-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
        }

        .webcam-wrapper iframe,
        .webcam-wrapper .yt-mount {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* "Connecting…" veil shown until a cam proves it is live */
        .cam-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #141414;
            color: #777;
            font-size: 0.9rem;
            font-weight: 300;
            transition: opacity 0.5s ease;
        }

        .webcam-container.live .cam-overlay {
            opacity: 0;
            pointer-events: none;
        }

        .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a8a4a;
            animation: pulse 1.4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.25; transform: scale(0.85); }
            50%      { opacity: 1;    transform: scale(1); }
        }

        .webcam-info {
            padding: 15px;
        }

        .webcam-name {
            font-size: 1rem;
            font-weight: 400;
            color: #e0e0e0;
            margin-bottom: 5px;
        }

        .webcam-channel {
            font-size: 0.85rem;
            color: #888;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error-message {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        /* Honest footnote when some views have gone dark */
        .dark-note {
            text-align: center;
            color: #555;
            font-size: 0.85rem;
            font-weight: 300;
            font-style: italic;
            margin-top: 2rem;
        }

        /* Whole-city empty state when nothing is left standing */
        .empty-dark {
            text-align: center;
            color: #777;
            padding: 60px 20px;
            line-height: 1.8;
            font-weight: 300;
        }

        .empty-dark strong {
            color: #aaa;
            font-weight: 400;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .prompt {
                font-size: 1.2rem;
            }

            #cityInput {
                font-size: 1.2rem;
            }

            .webcam-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .city-title {
                font-size: 1.5rem;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <!-- Landing Page -->
    <div class="landing" id="landingPage">
        <div class="prompt">
            I'd like to view
            <div class="autocomplete-container">
                <input
                    type="text"
                    id="cityInput"
                    placeholder="City, State"
                    autocomplete="off"
                >
                <div id="autocomplete-list" class="autocomplete-items"></div>
            </div>
            webcams
        </div>
        <div class="landing-actions" id="landingActions"></div>
    </div>

    <!-- Webcam View -->
    <div class="webcam-view" id="webcamView">
        <button class="back-button" onclick="goBack()">← Choose another city</button>
        <h1 class="city-title" id="cityTitle"></h1>
        <div class="view-actions">
            <button id="homeToggle" class="link-button"></button>
        </div>
        <div class="webcam-grid" id="webcamGrid"></div>
        <div class="dark-note" id="darkNote"></div>
    </div>

    <script>
        let webcamData = [];
        let cities = [];
        let currentCity = null;

        const HOME_KEY = 'stillthere.home';

        /* ---------- YouTube IFrame API plumbing ----------
           A raw <iframe> can't tell us whether a stream is dead — YouTube
           paints its own "Video unavailable" box inside the frame and the
           iframe still "loads". The IFrame Player API, by contrast, fires
           onError for removed / private / embedding-disabled videos and
           reports playback state. We use it to hide dead cams before they
           ever show as a black box. */
        let ytState = 'loading';            // 'loading' | 'ready' | 'failed'
        const pendingCams = [];             // cams waiting for the API verdict

        (function loadYouTubeApi() {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            tag.onerror = () => resolveYt('failed');
            document.head.appendChild(tag);
            // If the API never answers, fall back to plain iframes rather than hang.
            setTimeout(() => { if (ytState === 'loading') resolveYt('failed'); }, 8000);
        })();

        window.onYouTubeIframeAPIReady = function () { resolveYt('ready'); };

        function resolveYt(state) {
            if (ytState !== 'loading') return;
            ytState = state;
            while (pendingCams.length) mountCam(pendingCams.shift());
        }

        // Load and parse CSV
        async function loadWebcamData() {
            try {
                const response = await fetch('database.csv');
                const csvText = await response.text();

                const lines = csvText.split('\n');
                const headers = lines[0].split(',');

                // Parse CSV and filter out incomplete entries
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const values = parseCSVLine(line);

                    // Skip if missing essential data
                    if (!values[0] || !values[1] || !values[3]) continue;

                    const webcam = {
                        city: values[0].trim(),
                        state: values[1].trim(),
                        cameraName: values[2] ? values[2].trim() : 'Unnamed Camera',
                        youtubeUrl: values[3].trim(),
                        channelName: values[4] ? values[4].trim() : '',
                        status: values[5] ? values[5].trim() : 'Unknown'
                    };

                    webcamData.push(webcam);
                }

                // Get unique cities
                const citySet = new Set();
                webcamData.forEach(cam => {
                    citySet.add(`${cam.city}, ${cam.state}`);
                });
                cities = Array.from(citySet).sort();

                console.log(`Loaded ${webcamData.length} webcams from ${cities.length} cities`);
                afterLoad();
            } catch (error) {
                console.error('Error loading webcam data:', error);
                document.getElementById('landingPage').innerHTML =
                    '<div class="error-message">Error loading webcam data. Please refresh the page.</div>';
            }
        }

        // Parse CSV line handling commas in quotes
        function parseCSVLine(line) {
            const values = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];

                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    values.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            values.push(current);

            return values;
        }

        // Escape data-sourced text before injecting into markup
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        // Autocomplete functionality
        const cityInput = document.getElementById('cityInput');
        const autocompleteList = document.getElementById('autocomplete-list');

        cityInput.addEventListener('input', function() {
            const value = this.value.toLowerCase();
            autocompleteList.innerHTML = '';

            if (!value) return;

            const matches = cities.filter(city =>
                city.toLowerCase().includes(value)
            ).slice(0, 8); // Limit to 8 results

            matches.forEach(city => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.textContent = city;
                div.addEventListener('click', function() {
                    selectCity(city);
                });
                autocompleteList.appendChild(div);
            });
        });

        // Close autocomplete when clicking outside
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.autocomplete-container')) {
                autocompleteList.innerHTML = '';
            }
        });

        // Handle Enter key
        cityInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const value = this.value;
                const exactMatch = cities.find(city =>
                    city.toLowerCase() === value.toLowerCase()
                );

                if (exactMatch) {
                    selectCity(exactMatch);
                } else if (autocompleteList.children.length > 0) {
                    selectCity(autocompleteList.children[0].textContent);
                }
            }
        });

        // Select city and show webcams
        function selectCity(cityState) {
            autocompleteList.innerHTML = '';
            cityInput.value = '';

            const [city, state] = cityState.split(', ');
            const cityWebcams = webcamData.filter(cam =>
                cam.city === city && cam.state === state
            );

            if (cityWebcams.length === 0) {
                alert('No webcams found for this city.');
                return;
            }

            currentCity = cityState;

            // Update UI
            document.getElementById('landingPage').classList.add('hidden');
            document.getElementById('webcamView').classList.add('active');
            document.getElementById('cityTitle').textContent = cityState;
            updateHomeToggle();
            window.scrollTo(0, 0);

            // Display webcams
            displayWebcams(cityWebcams);
        }

        /* ---------- Liveness-aware rendering ---------- */
        let liveTracker = null;             // { expected, dark } for the current city

        // Display webcams in grid
        function displayWebcams(webcams) {
            const grid = document.getElementById('webcamGrid');
            grid.innerHTML = '';
            document.getElementById('darkNote').textContent = '';

            liveTracker = { expected: 0, dark: 0 };

            webcams.forEach((cam, idx) => {
                const videoId = extractVideoId(cam.youtubeUrl);
                if (!videoId) return; // Skip invalid URLs

                liveTracker.expected++;

                const container = document.createElement('div');
                container.className = 'webcam-container';

                const mountId = `yt-mount-${idx}-${videoId}`;
                container.innerHTML = `
                    <div class="webcam-wrapper">
                        <div class="yt-mount" id="${mountId}"></div>
                        <div class="cam-overlay"><span class="pulse"></span>Connecting…</div>
                    </div>
                    <div class="webcam-info">
                        <div class="webcam-name">${esc(cam.cameraName)}</div>
                        ${cam.channelName ? `<div class="webcam-channel">${esc(cam.channelName)}</div>` : ''}
                    </div>
                `;

                grid.appendChild(container);

                const item = { mountId, videoId, container, settled: false, timer: null };
                if (ytState === 'loading') {
                    pendingCams.push(item);
                } else {
                    mountCam(item);
                }
            });
        }

        // Bring a single cam to life — via the Player API if we have it,
        // otherwise a plain iframe (no detection, but never a hang).
        function mountCam(item) {
            if (ytState === 'failed') {
                mountFallbackIframe(item);
                return;
            }

            const player = new YT.Player(item.mountId, {
                videoId: item.videoId,
                playerVars: {
                    autoplay: 1, mute: 1, controls: 0,
                    modestbranding: 1, rel: 0, playsinline: 1, disablekb: 1
                },
                events: {
                    onReady: e => { try { e.target.playVideo(); } catch (_) {} },
                    onStateChange: e => {
                        // PLAYING (1) or BUFFERING (3) => it's genuinely showing something.
                        if (e.data === 1 || e.data === 3) markLive(item);
                    },
                    onError: () => markDark(item)   // removed / private / embedding off
                }
            });
            item.player = player;

            // Soft timeout: if it neither errored nor played (e.g. autoplay
            // blocked), stop showing "Connecting…" rather than declaring it dead.
            item.timer = setTimeout(() => { if (!item.settled) markLive(item); }, 20000);
        }

        function mountFallbackIframe(item) {
            const mount = document.getElementById(item.mountId);
            if (!mount) return;
            const iframe = document.createElement('iframe');
            iframe.src = `https://www.youtube.com/embed/${item.videoId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1`;
            iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
            iframe.allowFullscreen = true;
            mount.replaceWith(iframe);
            markLive(item);
        }

        function markLive(item) {
            if (item.settled) return;
            item.settled = true;
            clearTimeout(item.timer);
            item.container.classList.add('live');
        }

        function markDark(item) {
            if (item.settled) return;
            item.settled = true;
            clearTimeout(item.timer);
            try { if (item.player && item.player.destroy) item.player.destroy(); } catch (_) {}
            item.container.remove();
            if (liveTracker) {
                liveTracker.dark++;
                updateDarkState();
            }
        }

        // Reflect how many views have gone dark — honestly, but quietly.
        function updateDarkState() {
            const note = document.getElementById('darkNote');
            const grid = document.getElementById('webcamGrid');
            const { expected, dark } = liveTracker;

            if (dark > 0 && dark === expected) {
                // Nothing left standing — a gentle, on-theme empty state.
                note.textContent = '';
                grid.innerHTML = `
                    <div class="empty-dark">
                        Every view here has gone dark.<br>
                        <strong>${esc(currentCity)}</strong> is still there — but its cameras have stopped looking.<br>
                        Try another city, or check back another day.
                    </div>`;
            } else if (dark > 0) {
                note.textContent = dark === 1
                    ? '1 view has gone dark since this list was last checked.'
                    : `${dark} views have gone dark since this list was last checked.`;
            }
        }

        // Extract YouTube video ID from URL
        function extractVideoId(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length === 11) ? match[7] : null;
        }

        // Go back to landing page
        function goBack() {
            currentCity = null;
            document.getElementById('landingPage').classList.remove('hidden');
            document.getElementById('webcamView').classList.remove('active');
            document.getElementById('webcamGrid').innerHTML = '';
            document.getElementById('darkNote').textContent = '';
            buildLandingActions();
            cityInput.focus();
        }

        /* ---------- Presence: a remembered "home" city ---------- */
        function getHome() {
            try { return localStorage.getItem(HOME_KEY); } catch (_) { return null; }
        }
        function setHome(city) {
            try { localStorage.setItem(HOME_KEY, city); } catch (_) {}
        }
        function clearHome() {
            try { localStorage.removeItem(HOME_KEY); } catch (_) {}
        }

        function updateHomeToggle() {
            const btn = document.getElementById('homeToggle');
            const isHome = getHome() === currentCity;
            btn.textContent = isHome ? '★ Home — this opens when you arrive' : '☆ Make this your home';
            btn.onclick = () => {
                if (getHome() === currentCity) clearHome();
                else setHome(currentCity);
                updateHomeToggle();
            };
        }

        // Quiet text actions under the sentence: return home, and wander.
        function buildLandingActions() {
            const wrap = document.getElementById('landingActions');
            wrap.innerHTML = '';

            const home = getHome();
            if (home && cities.includes(home)) {
                const homeBtn = document.createElement('button');
                homeBtn.className = 'link-button';
                homeBtn.textContent = `return to ${home}`;
                homeBtn.onclick = () => selectCity(home);
                wrap.appendChild(homeBtn);
            }

            const surprise = document.createElement('button');
            surprise.className = 'link-button';
            surprise.textContent = 'visit somewhere at random';
            surprise.onclick = () => {
                if (!cities.length) return;
                const idx = Math.floor(Math.random() * cities.length);
                selectCity(cities[idx]);
            };
            wrap.appendChild(surprise);
        }

        // Called once the data is in: wire up actions and honor "home".
        function afterLoad() {
            buildLandingActions();
            const home = getHome();
            if (home && cities.includes(home)) {
                selectCity(home);
            } else {
                cityInput.focus();
            }
        }

        // Initialize
        loadWebcamData();
    </script>
</body>
</html>
