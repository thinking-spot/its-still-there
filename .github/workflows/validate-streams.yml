name: Validate streams

# Re-checks every webcam in streams.json through a real headless browser so the
# dataset heals itself: dead and embed-blocked streams get an accurate status,
# committed straight back to the repo. Runs weekly and on demand.
#
# KNOWN FAILURE MODE (hit for months, 2026-06-29 through 2026-08-31): YouTube's
# embed check can reject GitHub Actions' shared/datacenter IP ranges near-
# instantly for almost every video, producing a false mass "embed_blocked"
# result that looks nothing like a real per-video outcome. validate.mjs now
# refuses to write (and this job then fails loudly, visible in the Actions
# tab) if the live count would collapse to <50% of the last known-good run —
# so a checker/environment failure can no longer silently overwrite good data
# in production. A failed run here means "investigate", not "the streams
# actually died" — re-run from a non-datacenter IP (e.g. locally) to confirm.

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays 13:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools/validator
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run validator
        working-directory: tools/validator
        run: node validate.mjs

      - name: Commit updated statuses
        run: |
          if [[ -n "$(git status --porcelain streams.json tools/validator/last-report.json)" ]]; then
            git config user.name "stream-validator[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add streams.json tools/validator/last-report.json
            git commit -m "chore: weekly stream validation ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No status changes — nothing to commit."
          fi
